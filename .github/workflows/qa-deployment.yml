name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - qa
  workflow_dispatch:
    inputs:
      dev_image_tag:
        description: 'Dev image SHA to promote (leave empty to build from source)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  environment: qa

jobs:
  check-image-source:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      image_tag: ${{ steps.check.outputs.image_tag }}
    steps:
      - name: Determine image source
        id: check
        run: |
          if [ -n "${{ inputs.dev_image_tag }}" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "image_tag=${{ inputs.dev_image_tag }}" >> $GITHUB_OUTPUT
            echo "✅ Will promote existing dev image: ${{ inputs.dev_image_tag }}"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "⚠️ Will build new image from source"
          fi

  setup-infra:
    needs: check-image-source
    uses: Spinabot-v2/spinabot-infrastructure/.github/workflows/terraform.yml@main
    with:
      environment: qa
      github_branch: ${{ github.ref_name }}
      github_org: ${{ github.repository_owner }}
      github_repo: ${{ github.event.repository.name }}
      app_name: spinabot-ui
      artifact_registry: spinabot-ui
    secrets: inherit

  promote-image:
    needs: [check-image-source, setup-infra]
    if: needs.check-image-source.outputs.should_build == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate and Fetch Common Vault Secrets via Token
        uses: hashicorp/vault-action@v2.5.0
        with:
          url: https://vault.spinabot.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            kv/spinabot/qa/common-Infra pool_without_provider | pool_full_path;
            kv/spinabot/qa/common-Infra github_secrets_sa | github_secrets_sa;
            kv/spinabot/qa/common-Infra project_id | GCP_PROJECT_ID;
            kv/spinabot/qa/common-Infra github_builder_sa | github_builder_sa;
            kv/spinabot/qa/common-Infra region | region;

      - name: Authenticate and Fetch Terraform generated outputs
        uses: hashicorp/vault-action@v2.5.0
        with:
          url: https://vault.spinabot.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            kv/spinabot/dev/app-secrets/spinabot-ui/tf-generated artifact_registry_url | dev_artifact_registry_url;
            kv/spinabot/qa/app-secrets/spinabot-ui/tf-generated artifact_registry_url | qa_artifact_registry_url;
            kv/spinabot/qa/app-secrets/spinabot-ui/tf-generated provider_id | provider_id;

      - name: Authenticate via WIF
        id: auth
        uses: google-github-actions/auth@v0.4.0
        with:
          workload_identity_provider: ${{ env.pool_full_path }}/providers/${{ env.provider_id}}
          service_account: ${{ env.github_builder_sa }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/cloud-platform"
          create_credentials_file: true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{env.region}}-docker.pkg.dev --quiet
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Promote dev image to QA
        run: |
          DEV_IMAGE="${{env.dev_artifact_registry_url}}/spinabot-ui:${{ needs.check-image-source.outputs.image_tag }}"
          QA_IMAGE="${{env.qa_artifact_registry_url}}/qa-spinabot-ui:latest"
          
          echo "📦 Pulling dev image: $DEV_IMAGE"
          docker pull "$DEV_IMAGE"
          
          echo "🏷️ Tagging for QA: $QA_IMAGE"
          docker tag "$DEV_IMAGE" "$QA_IMAGE"
          
          echo "⬆️ Pushing to QA registry"
          docker push "$QA_IMAGE"
          
          echo "✅ Image promoted successfully!"

  build-and-deploy:
    needs: [check-image-source, setup-infra]
    if: needs.check-image-source.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate and Fetch Common Vault Secrets via Token
        uses: hashicorp/vault-action@v2.5.0
        with:
          url: https://vault.spinabot.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            kv/spinabot/qa/common-Infra pool_without_provider | pool_full_path;
            kv/spinabot/qa/common-Infra github_secrets_sa | github_secrets_sa;
            kv/spinabot/qa/common-Infra project_id | GCP_PROJECT_ID;
            kv/spinabot/qa/common-Infra github_builder_sa | github_builder_sa;
            kv/spinabot/qa/common-Infra github_deployer_sa | github_deployer_sa;
            kv/spinabot/qa/common-Infra region | region;
            kv/spinabot/qa/common-Infra sql_instance_connection | DEV_CONNECTION_NAME;
            kv/spinabot/qa/app-secrets/spinabot-ui DATABASE_URL | DATABASE_URL;
            kv/spinabot/qa/app-secrets/spinabot-ui BETTER_AUTH_SECRET | BETTER_AUTH_SECRET;
            kv/spinabot/qa/app-secrets/spinabot-ui NEXT_PUBLIC_CONVEX_URL | NEXT_PUBLIC_CONVEX_URL;
            kv/spinabot/qa/app-secrets/spinabot-ui GOOGLE_CLIENT_ID | GOOGLE_CLIENT_ID;
            kv/spinabot/qa/app-secrets/spinabot-ui GOOGLE_CLIENT_SECRET | GOOGLE_CLIENT_SECRET;
            kv/spinabot/qa/app-secrets/spinabot-ui ENCRYPTION_KEY | ENCRYPTION_KEY;
            kv/spinabot/qa/app-secrets/spinabot-ui POLAR_ACCESS_TOKEN | POLAR_ACCESS_TOKEN;

      - name: Authenticate and Fetch Terrafrom generated outputs
        uses: hashicorp/vault-action@v2.5.0
        with:
          url: https://vault.spinabot.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            kv/spinabot/qa/app-secrets/spinabot-ui/tf-generated artifact_registry_url | artifact_registry_url;
            kv/spinabot/qa/app-secrets/spinabot-ui/tf-generated provider_id | provider_id;

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Authenticate via WIF for Build
        id: auth-build
        uses: google-github-actions/auth@v0.4.0
        with:
          workload_identity_provider: ${{ env.pool_full_path }}/providers/${{ env.provider_id}}
          service_account: ${{ env.github_secrets_sa}}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set env's in runner environment
        run: |
          echo "VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}" >> $GITHUB_ENV
          echo "VAULT_ADDR=https://vault.spinabot.com" >> $GITHUB_ENV
          echo "VAULT_SECRET_PATH=spinabot/qa/app-secrets/spinabot-ui" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=${{ env.BETTER_AUTH_SECRET }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CONVEX_URL=${{ env.NEXT_PUBLIC_CONVEX_URL }}" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_SECRET=${{ env.GOOGLE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=${{ env.ENCRYPTION_KEY }}" >> $GITHUB_ENV
          echo "POLAR_ACCESS_TOKEN=${{ env.POLAR_ACCESS_TOKEN }}" >> $GITHUB_ENV
          echo "AUTH_ENV=production" >> $GITHUB_ENV

      - name: Install Install
        run: npm install 
        
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run:  npx prisma generate
      
      - name: Build
        run: npm run build
 

      - name: test the application
        run: |
          npm test

      - name: Authenticate via WIF for Build and Push
        id: auth-build-push
        uses: google-github-actions/auth@v0.4.0
        with:
          workload_identity_provider: ${{ env.pool_full_path }}/providers/${{ env.provider_id}}
          service_account: ${{ env.github_builder_sa }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/cloud-platform"
          create_credentials_file: true

      - name: Re-configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{env.region}}-docker.pkg.dev --quiet
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth-build-push.outputs.credentials_file_path }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg DATABASE_URL="${{ env.DATABASE_URL }}" \
            --build-arg BETTER_AUTH_SECRET="${{ env.BETTER_AUTH_SECRET }}" \
            --build-arg ENCRYPTION_KEY="${{ env.ENCRYPTION_KEY }}" \
            --build-arg VAULT_ADDR="${{ env.VAULT_ADDR }}" \
            --build-arg VAULT_TOKEN="${{ secrets.VAULT_TOKEN }}" \
            --build-arg VAULT_SECRET_PATH="${{ env.VAULT_SECRET_PATH }}" \
            --build-arg NEXT_PUBLIC_CONVEX_URL="${{ env.NEXT_PUBLIC_CONVEX_URL }}" \
            --build-arg GOOGLE_CLIENT_ID="${{ env.GOOGLE_CLIENT_ID }}" \
            --build-arg GOOGLE_CLIENT_SECRET="${{ env.GOOGLE_CLIENT_SECRET }}" \
            --build-arg POLAR_ACCESS_TOKEN="${{ env.POLAR_ACCESS_TOKEN }}" \
            -t "${{env.artifact_registry_url}}/${{env.environment}}-spinabot-ui:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${{env.artifact_registry_url}}/${{env.environment}}-spinabot-ui:latest"

      - name: Authenticate via WIF for Deployment
        id: auth-deploy
        uses: google-github-actions/auth@v0.4.0
        with:
          workload_identity_provider: ${{ env.pool_full_path }}/providers/${{ env.provider_id}}
          service_account: ${{ env.github_deployer_sa}}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{env.environment}}-spinabot-ui \
            --image "${{env.artifact_registry_url}}/${{env.environment}}-spinabot-ui:latest" \
            --region ${{env.region}} \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector=qa-vpc-connector \
            --vpc-egress=all-traffic \
            --set-env-vars="VAULT_TOKEN=${{ secrets.VAULT_TOKEN }},APP_ENV=${{ env.environment }},VAULT_ADDR=https://vault.spinabot.com,VAULT_SECRET_PATH=spinabot/qa/app-secrets/spinabot-ui"

  deploy:
    needs: [check-image-source, setup-infra, promote-image]
    if: needs.check-image-source.outputs.should_build == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate and Fetch Common Vault Secrets via Token
        uses: hashicorp/vault-action@v2.5.0
        with:
          url: https://vault.spinabot.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            kv/spinabot/qa/common-Infra pool_without_provider | pool_full_path;
            kv/spinabot/qa/common-Infra github_secrets_sa | github_secrets_sa;
            kv/spinabot/qa/common-Infra project_id | GCP_PROJECT_ID;
            kv/spinabot/qa/common-Infra github_deployer_sa | github_deployer_sa;
            kv/spinabot/qa/common-Infra region | region;

      - name: Authenticate and Fetch Terraform generated outputs
        uses: hashicorp/vault-action@v2.5.0
        with:
          url: https://vault.spinabot.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            kv/spinabot/qa/app-secrets/spinabot-ui/tf-generated artifact_registry_url | artifact_registry_url;
            kv/spinabot/qa/app-secrets/spinabot-ui/tf-generated provider_id | provider_id;

      - name: Authenticate via WIF for Deployment
        id: auth-deploy
        uses: google-github-actions/auth@v0.4.0
        with:
          workload_identity_provider: ${{ env.pool_full_path }}/providers/${{ env.provider_id}}
          service_account: ${{ env.github_deployer_sa}}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy qa-spinabot-ui \
            --image "${{env.artifact_registry_url}}/qa-spinabot-ui:latest" \
            --region ${{env.region}} \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector=qa-vpc-connector \
            --vpc-egress=all-traffic \
            --set-env-vars="VAULT_TOKEN=${{ secrets.VAULT_TOKEN }},APP_ENV=qa,VAULT_ADDR=https://vault.spinabot.com,VAULT_SECRET_PATH=spinabot/qa/app-secrets/spinabot-ui"