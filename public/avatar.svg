<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(64 44) rotate(90) scale(70 70)">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#050814"/>
    </radialGradient>

    <linearGradient id="face" x1="40" y1="40" x2="88" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9F3FF"/>
      <stop offset="1" stop-color="#BFD7FF"/>
    </linearGradient>

    <linearGradient id="visor" x1="38" y1="50" x2="90" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="64" cy="64" r="58" stroke="url(#ring)" stroke-width="6"/>

  <!-- Background -->
  <circle cx="64" cy="64" r="54" fill="url(#bg)"/>

  <!-- Subtle stars -->
  <g opacity="0.35">
    <circle cx="28" cy="36" r="1.5" fill="#93C5FD"/>
    <circle cx="96" cy="30" r="1.2" fill="#A78BFA"/>
    <circle cx="104" cy="78" r="1.6" fill="#22D3EE"/>
    <circle cx="30" cy="88" r="1.1" fill="#60A5FA"/>
    <circle cx="74" cy="20" r="1.0" fill="#67E8F9"/>
  </g>

  <!-- Head -->
  <circle cx="64" cy="62" r="26" fill="url(#face)"/>

  <!-- Visor -->
  <path d="M40 60c0-8 10-14 24-14s24 6 24 14-10 14-24 14-24-6-24-14z"
        fill="url(#visor)" opacity="0.95"/>
  <path d="M44 60c0-6 9-11 20-11s20 5 20 11-9 11-20 11-20-5-20-11z"
        fill="#0B1220" opacity="0.25"/>

  <!-- Eyes glow dots -->
  <g filter="url(#softGlow)">
    <circle cx="54" cy="60" r="2.4" fill="#E0F2FE"/>
    <circle cx="74" cy="60" r="2.4" fill="#E0F2FE"/>
  </g>

  <!-- Smile -->
  <path d="M55 74c2.5 3 5.8 4.5 9 4.5s6.5-1.5 9-4.5"
        stroke="#0B1220" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>

  <!-- Antenna + node -->
  <path d="M64 34v-8" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <circle cx="64" cy="22" r="4" fill="#67E8F9" filter="url(#softGlow)"/>

  <!-- Neck/shoulders -->
  <path d="M36 106c6-14 16-22 28-22s22 8 28 22"
        fill="none" stroke="#93C5FD" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>

  <!-- Small chip lines -->
  <g opacity="0.6">
    <path d="M28 64h10" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
    <path d="M90 64h10" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    <path d="M64 96v8" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
